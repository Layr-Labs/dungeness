id: ecdsa-starter
instruction: statement.txt

relations:
  problem: problem:public/ecdsafail-challenge/ecdsa-fail

workspace:
  include:
    - .

interfaces:
  point-add-module-v1:
    candidate:
      allowed_paths:
        - src/point_add
    verifier: ecdsa-fail/benchmark-sh

policies:
