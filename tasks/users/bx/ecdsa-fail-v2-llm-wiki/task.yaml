schema_version: 1
type: task
namespace: users/bx
id: ecdsa-fail-v2-llm-wiki
instruction: statement.txt

relations:
  problem: problem:public/ecdsafail-challenge/ecdsa-fail

workspace:
  include:
    - .

interfaces:
  point-add-file-v1:
    candidate:
      allowed_paths:
        - src/point_add.rs
    verifier: ecdsa-fail/experiment-bin
  point-add-module-v1:
    candidate:
      allowed_paths:
        - src/point_add
    verifier: ecdsa-fail/benchmark-sh
    resources:
      verifier:
        memory_mb: 8192

policies:
  network: policies/network/mediated.yaml
  web: policies/web/exa.yaml
  budget: policies/budget/default.yaml

metadata:
  description: >-
    ecdsa-fail v2 with an initial prompt requiring an incrementally maintained
    LLM-written working wiki
  keywords:
    - ecdsa-fail
    - quantum
    - reversible-circuit
    - optimization
    - knowledge-base
    - llm-wiki

evaluation:
  mode: full-benchmark

resources:
  agent:
    memory_mb: 4096
    cpus: 4
  verifier:
    memory_mb: 20480
    cpus: 4
    timeout_sec: 1200
    build_timeout_sec: 1200
