schema_version: 1
type: task
namespace: users/bx
id: ecdsa-fail
instruction: statement.txt

relations:
  problem: problem:public/ecdsafail-challenge/ecdsa-fail

# This is Dungeness's executable representation of the research task. It is
# independent from the public Git checkpoint records: a run explicitly combines
# this task with one checkpoint and one research agent.

# The whole repo is one Rust crate, so the agent workspace must be the repo root
# (cargo needs Cargo.toml/Cargo.lock/rust-toolchain/src/* at the root), not just
# the candidate's parent dir, so the whole repo is the workspace. build.py honors
# this via `include: ["."]` (whole-checkout copy).
workspace:
  include:
    - .

# Public commits expose two source interfaces. The checkpoint records only which
# interface exists at that commit; this task decides how Dungeness executes it.
interfaces:
  point-add-file-v1:
    candidate:
      allowed_paths:
        - src/point_add.rs
    verifier: ecdsa-fail/experiment-bin
  point-add-module-v1:
    candidate:
      allowed_paths:
        - src/point_add
    verifier: ecdsa-fail/benchmark-sh
    resources:
      verifier:
        memory_mb: 8192

# Shared policies (pointers, so tasks don't duplicate them). The web policy is
# the shared, cutoff-free knob set; the historical cutoff is authored on the commit
# a run starts from (the checkpoint's `web_cutoff`), so it
# follows the start commit rather than being pinned per-task here.
policies:
  network: policies/network/mediated.yaml
  web: policies/web/exa.yaml
  budget: policies/budget/default.yaml

metadata:
  description: "ecdsa-fail: minimize avg_Toffoli x peak_qubits of a reversible secp256k1 point-add circuit"
  keywords: ["ecdsa-fail", "quantum", "reversible-circuit", "optimization"]

# Agent feedback: a full-benchmark eval sidecar. The agent submits its candidate
# via `evaluate`; the sidecar (the verifier grader in serve mode) runs the real
# un-gameable benchmark and returns the true score. No dev/holdout split -- the
# Fiat-Shamir shots derive from the candidate's own op stream, so there is
# nothing to hide. Submissions are budget-metered (policies/budget/default.yaml).
evaluation:
  mode: full-benchmark

# Resource envelope. The old point-add-file interface uses a single-process
# evaluator measured near 15 GB, so it retains a 20 GB verifier cap. The module
# interface overrides that cap to 8 GB: its split harness streams ops.bin and no
# longer keeps a duplicate serialized operation buffer in memory.
resources:
  # Authoritative full runs belong in the evaluation sidecar. Keeping the agent
  # at 4 GB lets it compile and run focused checks without forcing every host to
  # reserve enough RAM for a second full simulator.
  agent:
    memory_mb: 4096
    cpus: 4
  verifier:
    memory_mb: 20480
    cpus: 4
    timeout_sec: 1200
    build_timeout_sec: 1200

# Feedback model: the agent image (agents/<namespace>/<id>/Dockerfile) ships the pinned
# Rust toolchain, so the agent can compile and run focused local checks. It gets
# authoritative full-benchmark feedback by submitting its candidate (via
# `evaluate`) to a Rust EVAL SIDECAR
# that runs the real benchmark. The benchmark is un-gameable (Fiat-Shamir shots
# derived from the candidate's own op stream), so a local run yields the SAME true
# score -- nothing to overfit; the sidecar and the clean verifier re-run the same
# benchmark for the metered feedback and the official record respectively.
