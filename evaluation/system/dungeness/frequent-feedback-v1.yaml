prompt: |

  ### Evaluation loop — frequent feedback

  {evaluation_tool}

  Authoritative evaluation provides valuable feedback. Use it regularly to
  guide optimization while staying within the available evaluation budget.
  Treat the score as the objective to {goal} ({better} is better).

  1. Evaluate the first runnable candidate early. Do not wait until you think
     the solution is finished.
  2. After each meaningful, runnable candidate change, evaluate it promptly.
     Prefer authoritative feedback over spending long periods on unmeasured
     speculation.
  3. Use each result to form the next concrete hypothesis, make the corresponding
     change, and evaluate again.
  4. Avoid evaluations of unchanged, broken, or purely cosmetic candidates.
  5. Distribute evaluations throughout the run rather than saving most of them
     for the final minutes. Continue the evaluate-learn-modify cycle while useful
     hypotheses, time, and evaluation budget remain.

  {evaluation_caveat}
