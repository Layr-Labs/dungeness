schema_version: 1
type: claim
namespace: users/bx
id: ecdsa-kimi-subscription-web-research-policy-low-12usd

relations:
  experiment: experiment:users/bx/ecdsa-kimi-subscription-web-research-policy-low-12usd

statement: >-
  With task, checkpoint, Kimi K3 subscription route, low reasoning effort,
  search backend, shared budgets, runtime, and evaluation held constant,
  ownership of the adaptive web-research policy changes how effectively web
  evidence is converted into verified candidate improvement.

comparisons:
  - m2: main agent searches, interprets, and chooses each next search
  - m3: main agent owns policy while thin workers execute narrow branches
  - m4: a dedicated researcher owns the search process and returns an evidence packet

estimands:
  primary:
    - final_verified_score
    - verified_relative_improvement
  research_process:
    - searches
    - fetches
    - unique_sources
    - research_worker_invocations
    - model_tokens_used_by_workers
    - time_from_evidence_to_candidate_change
  solution_process:
    - evaluations
    - time_to_best_score
    - valid_candidate
    - normalized_usd
    - total_model_tokens

analysis:
  group_by: research_method
  comparison: descriptive
  inspect:
    - whether queries adapt to earlier evidence
    - whether cited evidence produces a concrete candidate hypothesis
    - whether evaluation feedback triggers targeted follow-up research
    - whether delegation overhead displaces implementation or evaluation work

validity:
  - Treat M3 as valid only when workers receive narrow branches and the main
    agent performs synthesis.
  - Treat M4 as valid only when the researcher chooses its own search path and
    returns a structured evidence packet.
  - All worker and main-agent model/web calls must pass through the same run
    gateway and count against the same budgets.

limitations:
  - One run per treatment is exploratory and cannot separate policy effects
    from stochastic variation.
  - Worker treatments spend some shared model budget on coordination and
    evidence packets; that cost is part of the treatment.
