schema_version: 1
type: claim
namespace: users/bx
id: ecdsa-kimi-subscription-llm-wiki-effect-max-12usd

relations:
  experiment: experiment:users/bx/ecdsa-kimi-subscription-llm-wiki-max-12usd

statement: >-
  With the benchmark, checkpoint, Codex harness, Kimi K3 model at maximum
  reasoning effort, search access, evaluation policy, budget, and runtime held
  fixed, an initial prompt requiring a persistent working wiki helps the agent
  accumulate evidence across its trajectory and choose better optimization
  experiments.

predictions:
  - The knowledge-base treatment creates the required wiki before its first
    candidate edit or authoritative evaluation and updates it after meaningful
    evidence or evaluation results.
  - The knowledge-base treatment repeats fewer disproven implementation
    directions than the control.
  - The knowledge-base treatment reaches a best verified score no worse than
    the control at the same nominal budget.

estimands:
  primary:
    name: best_verified_score
    direction: minimize
  secondary:
    - final_score
    - verified_relative_improvement
    - evaluations_to_best
    - invalid_evaluations
    - repeated_failed_directions
    - time_to_best_score
    - billed_usd
    - model_tokens
    - knowledge_base_protocol_compliance

analysis:
  group_by: prompt_treatment
  comparison: descriptive
  trajectory_review:
    - Check whether the required files were initialized before candidate edits
      or evaluation.
    - Check whether hypotheses contain predictions and are updated after
      evaluation evidence.
    - Check whether index and log maintenance remains concise and current.
    - Compare repeated directions, evaluation cadence, and score progression.

limitations:
  - One run per treatment cannot distinguish prompt effects from stochastic
    variation.
  - The wiki consumes some model tokens and tool time, so any benefit must
    outweigh its maintenance overhead.
  - The knowledge base is run-local and intentionally outside the graded
    candidate; this experiment disables continuation so it remains available
    throughout one uninterrupted agent session.
  - Protocol-compliance judgments require trajectory review and are not an
    automated verifier metric.
