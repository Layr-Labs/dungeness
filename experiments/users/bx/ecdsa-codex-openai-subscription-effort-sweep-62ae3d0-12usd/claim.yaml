schema_version: 1
type: claim
namespace: users/bx
id: ecdsa-codex-openai-subscription-effort-effect-62ae3d0

relations:
  experiment: experiment:users/bx/ecdsa-codex-openai-subscription-effort-sweep-62ae3d0-12usd

statement: >-
  Under a fixed normalized model budget, the requested Codex reasoning effort
  affects verified improvement from the same ECDSA checkpoint.

predictions:
  - Verified improvement increases with reasoning effort.
  - Improvement has diminishing returns between high and xhigh.
  - Higher effort consumes more reasoning tokens and may leave fewer turns for
    implementation under the fixed normalized budget.

estimands:
  primary:
    name: verified_relative_improvement
    formula: (checkpoint_score - final_score) / checkpoint_score
  secondary:
    - final_score
    - best_score
    - reasoning_tokens
    - input_tokens
    - output_tokens
    - model_turns
    - evaluations
    - time_to_best_score

analysis:
  group_by: reasoning_effort
  comparison: descriptive

limitations:
  - One run per effort level cannot distinguish effort effects from stochastic variance.
  - Subscription quota and provider conditions may vary over execution time.
  - Reasoning summaries are model-generated summaries, not raw chain-of-thought.
