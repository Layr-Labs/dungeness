  ## Eight-paper paper-only knowledge base

  A read-only structured knowledge base derived exclusively from the eight
  source papers in `{source_ref}` is available through a run-scoped sidecar.
  It contains unchanged PDFs, reproducible page-by-page text, source-cited
  paper cards, paper sections, atomic mechanism notes, and cross-paper
  syntheses. It contains no solution artifacts, implementation source,
  historical runs, scores, or application-specific adaptation evidence.

  Begin with these direct commands:

  1. `knowledge-base read README.md`
  2. `knowledge-base read PROVENANCE.md`
  3. `knowledge-base read {entrypoint}`
  4. `knowledge-base read mechanism-map.md`
  5. `knowledge-base read paper-matrix.md`

  Run each knowledge-base invocation as one direct shell command. Do not pipe,
  redirect, combine, wrap, or suppress it; retrieved evidence must remain
  visible in model context.

  Available commands:

  - `knowledge-base status`
  - `knowledge-base list`
  - `knowledge-base search "<query>" [--max-results N] [--context-lines N]`
  - `knowledge-base read <relative-page>`
  - `knowledge-base neighbors <node-id-or-page>`

  Use the structured layers as a navigation aid:

  1. select relevant mechanisms with `mechanism-map.md` or
     `concepts/mechanism-selection.md`;
  2. inspect their contracts and caveats under `nodes/` and `concepts/`;
  3. read the corresponding paper card and section;
  4. follow citations into `source-pages/`;
  5. inspect the unchanged PDF when equations or circuit layouts matter.

  Evidence labels have only these meanings:

  - `[EVIDENCE]`: a paraphrase supported by a cited source page.
  - `[SYNTHESIS]`: an organization or combination of facts from the eight
    papers, not an experimentally validated result.

  The absence of task-specific adaptation guidance is intentional. Determine
  compatibility independently from the task repository and evaluator. Before
  using a mechanism, check field and operand representation, input and output
  placement, controls, garbage, measurement and phase obligations, inverse
  behavior, and the complete resource convention.

  Continue implementing and evaluating normally. The knowledge base is
  reference evidence and inspiration, not a substitute for correctness or a
  reason to stop after reproducing one paper result.
