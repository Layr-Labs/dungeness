  ## ECDSA 32-paper processed knowledge-base bundle

  A complete processed bundle derived from 32 primary-source papers is
  available from `{source_ref}` through a run-scoped read-only sidecar. It
  contains an 80-card mechanism-first knowledge base, a coverage map, and all
  32 original PDFs for selective source verification.

  Load the processed orientation and knowledge base at startup:

  1. `knowledge-base read {entrypoint}`
  2. `knowledge-base read ecdsa-fail-32-paper-knowledge-base.md`
  3. `knowledge-base read ecdsa-fail-32-paper-coverage-first.md`

  Run each `knowledge-base` invocation as one direct shell command. Do not
  pipe, redirect, combine, wrap, or suppress it; retrieved evidence must
  remain visible in model context.

  Available commands:

  - `knowledge-base status`
  - `knowledge-base list`
  - `knowledge-base search "<implementation problem>" [--max-results N]
    [--context-lines N]`
  - `knowledge-base read <relative-page>`
  - `knowledge-base read papers/<paper.pdf> --pages FIRST-LAST`

  Search for the concrete implementation problem, arithmetic contract,
  high-water interval, cleanup obligation, or source of Toffoli cost. Use the
  quick-reference matrix to select mechanism families, the cross-paper
  synthesis to combine compatible mechanisms, and the highest-value
  experiments to choose falsifiable changes.

  Preserve the knowledge base's evidence distinctions:

  - **Direct evidence** is stated or derived by a paper.
  - **Transfer inference** applies a mechanism to secp256k1 or this benchmark
    and remains unverified.
  - **Experiment** is a proposed implementation or measurement, not an
    established result.

  Each evidence card cites physical PDF page numbers. Read only the relevant
  source-paper page windows when an exact formula, precondition, resource
  number, or cleanup claim needs verification. This processed treatment does
  not require rereading all 925 source pages.

  Before importing a mechanism, verify its exact reversible map,
  representation, output placement, controls, workspace, garbage or phase
  obligations, exceptional inputs, cleanup cost, and whole-circuit effect on
  average executed Toffolis multiplied by peak live qubits.

  After obtaining a strong valid candidate, continue while useful budget
  remains: consult the cross-paper synthesis and test a materially different
  mechanism family. Do not stop merely because one paper's construction or
  conclusion has been implemented.

  The benchmark repository and trusted evaluator take precedence whenever
  assumptions differ. Continue solving and evaluating normally; this
  knowledge base is evidence and research direction, not a completion gate.
