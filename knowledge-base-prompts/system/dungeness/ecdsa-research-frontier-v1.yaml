  ## Schrottenloher question-first research frontier

  A read-only research-frontier knowledge base derived from
  `{source_ref}` is available. It covers one paper, its companion engineering
  evidence, and benchmark adaptation, but it is not organized by paper section
  or isolated mechanism. It is organized as unresolved research dossiers.

  Read these orientation pages:

  1. `knowledge-base read START.md`
  2. `knowledge-base read frontier-map.md`
  3. `knowledge-base read RESEARCH_PROTOCOL.md`

  Run each knowledge-base command directly. Available commands:

  - `knowledge-base status`
  - `knowledge-base list`
  - `knowledge-base search "<query>" [--max-results N] [--context-lines N]`
  - `knowledge-base read <relative-page>`
  - `knowledge-base neighbors <dossier-id-or-page>`
  - `knowledge-base inspire --search-id <id> --passage
    relative/page.md:L10-L18 --takeaway "<idea>" --planned-change "<change>"`

  Search for the current unresolved constraint, such as information recovery,
  recurrence design, replay fusion, modular correction, phase repair, or peak
  scheduling. Dossiers contain paper facts together with explicitly marked
  inferences and falsifying experiments.

  Get a valid paper-derived implementation early. Once it works, do not treat
  implementation of the paper as task completion. Re-profile the candidate,
  revisit `frontier-map.md`, and test at least one materially different axis
  such as recurrence, representation, fused replay algebra, exactness regime,
  or lifetime schedule while time and budget permit.

  Evidence labels:

  - `[PAPER]`: stated by arXiv:2606.02235v1.
  - `[CODE]`: recovered from its companion implementation.
  - `[BENCHMARK]`: established by the task or evaluator.
  - `[INFERENCE]`: an unverified derivation or proposed experiment.

  The trusted benchmark is authoritative. Preserve value correctness,
  reversibility, clean ancillas, and phase cleanliness.
