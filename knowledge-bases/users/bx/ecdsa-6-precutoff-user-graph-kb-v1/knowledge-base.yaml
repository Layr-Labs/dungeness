schema_version: 1
type: knowledge-base
namespace: users/bx
id: ecdsa-6-precutoff-user-graph-kb-v1
title: User-supplied six-paper quantum-arithmetic graph knowledge base
entrypoint: README.md

source:
  kind: user-supplied-atomic-graph-reorganization
  import_directory_name: six-paper-quantum-arithmetic-kb
  import_manifest: manifest.json
  import_checksums: checksums.sha256
  cutoff_rule: first public version strictly before 2026-04-01
  paper_count: 6
  node_count: 18
  concept_page_count: 8
  sources:
    - arXiv:2410.00899v1
    - arXiv:2407.20167v1
    - arXiv:2507.23079v1
    - arXiv:2110.08973v3
    - arXiv:2510.10967v1
    - IACR-ePrint:2020/077
  exclusions:
    - papers first public on or after 2026-04-01
    - prior Astra runs or discoveries
    - benchmark scores or tuned parameters
    - unpublished companion implementations

interface:
  mode: atomic-nodes-with-concept-graph
  operations:
    - status
    - list
    - search
    - read
    - neighbors
    - inspire

maintenance:
  mutable_during_run: false
  mutable_overlay: knowledge-base-notes/
  preserve_source_facts: true
  append_only_log: log.md
  evidence_marker: PAPER

scope_manifest:
  name: Six-paper quantum arithmetic and measurement knowledge graph
  authority: source-grounded_for_domain
  topics:
    - reversible prime-field arithmetic
    - schoolbook multiplication
    - modular addition and control locality
    - measurement-based uncomputation
    - carry venting and phase obligations
    - quantum pebbling
    - reversible EEA and direct division
    - Kaliski inversion
    - Montgomery representation
    - producer-consumer lifetime optimization
  common_entities:
    - Litinski
    - Luongo
    - Gidney
    - Kornerup
    - Khattar
    - Häner
    - Kaliski
    - Dialog
    - Montgomery
  initial_search_seed: controlled add subtract measurement carry venting direct division Kaliski producer consumer representation workspace
  citation_format: '[KB: relative/path.md#L10-L18]'

behavior_feedback:
  enabled: false
  mode: 'off'
  qualifying_sources:
    prefixes:
      - nodes/
      - concepts/
      - sections/
    pages:
      - AGENTS.md
      - paper-matrix.md
      - index.md
  retrieval:
    max_results_per_search: 10
    context_lines: 4
    max_passage_characters: 2000
    max_total_result_characters: 12000

preload:
  status: ready
  intended_destination: knowledge-base/
  copy_contents: true
  core_files: []

content_layers:
  orientation:
    - README.md
    - AGENTS.md
    - index.md
    - paper-matrix.md
  atomic_nodes:
    - nodes/
  cross_paper_concepts:
    - concepts/
  paper_sections:
    - sections/
  source_provenance:
    - sources/
  graph_and_machine_indexes:
    - graph.md
    - graph.json
    - nodes.jsonl
    - manifest.json
  single_file_pack:
    - agent-pack.md
  package_audit:
    - checksums.sha256
    - log.md

created_at: '2026-09-10T00:00:00Z'
updated_at: '2026-09-10T00:00:00Z'
