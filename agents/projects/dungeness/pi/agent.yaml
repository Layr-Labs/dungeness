schema_version: 1
type: agent
namespace: projects/dungeness
id: pi
execution_mode: installed

# Pin the pi coding-agent release. Harbor's built-in `pi` adapter installs
# @mariozechner/pi-coding-agent; we pre-bake it in the image (below) so no
# network install happens after the sandbox starts.
package:
  name: "@mariozechner/pi-coding-agent"
  version: "0.73.1"

# Harbor's pi adapter requires `provider/model` form. This agent profile pins
# the complete tested runtime/model/route combination.
model:
  provider: openrouter
  upstream_id: openai/gpt-5.6-sol
  request_model: openai/gpt-5.6-sol
  api: openai-responses
  name_format: provider/request
  defaults:
    reasoning_effort: high

harbor:
  agent: pi
  # Harbor's stock `pi` adapter always runs a NETWORK install() at setup (curl
  # nvm + npm install), which dies in the no-egress sandbox. We route to a
  # pre-baked subclass that skips it (pi is baked into the image), mirroring how
  # Codex/Claude short-circuit install when the binary is already present.
  # Selecting a class by import_path requires the module on PYTHONPATH -- run
  # harbor with PYTHONPATH=adapters/harbor (see README/commands).
  import_path: "pi_prebaked:PiPrebaked"
  kwargs:
    # pi's adapter exposes exactly one tunable CLI flag: --thinking. For Opus 5,
    # the image's compatibility patch maps this level to adaptive thinking plus
    # output_config.effort. "high" avoids the unconstrained default behavior
    # we saw with claude-code while retaining useful reasoning.
    # NOTE: pi's adapter only understands `thinking` (+ `version`); any other
    # kwarg would leak to the base constructor, so we pass nothing else. Tool
    # parity is automatic -- pi's built-ins are read/bash/edit/write/grep/find/ls
    # with NO web tool, so research is forced through the gateway `web` command.
    thinking: "high"

# Provider detection: build.py keys off OPENROUTER_API_KEY in this block to
# select the OpenRouter gateway route + inject the real upstream key into the
# gateway only. The agent holds just the placeholder. The gateway base URL is
# NOT set here (pi ignores base-URL env vars) -- it comes from the baked
# models.json (see Dockerfile), the pi analog of Codex's config.toml pre-seed.
environment:
  OPENROUTER_API_KEY: testbed
