schema_version: 1
type: agent
namespace: projects/dungeness
id: codex-claude-openrouter
execution_mode: installed

# Codex CLI driving Claude Opus 5. OpenRouter's Responses API serves Anthropic
# models with function calling and provider-visible reasoning items, so the
# Codex harness, gateway route, and image are the same as codex-openrouter;
# only the model pin differs.
image:
  from: agent:projects/dungeness/codex-openrouter

package:
  name: "@openai/codex"
  version: "0.148.0"

model:
  provider: openrouter
  upstream_id: anthropic/claude-opus-5
  request_model: anthropic/claude-opus-5
  api: openai-responses
  name_format: request
  # OpenRouter lists Opus 5 at a 1M-token context; tell Codex so its compaction
  # thresholds match the model instead of a generic default.
  context_window: 1000000
  # OpenRouter maps Codex's reasoning.effort onto Anthropic thinking budgets and
  # accepts all four Codex levels.
  supported_reasoning_efforts: [low, medium, high, xhigh]
  defaults:
    reasoning_effort: high
    # Anthropic reasoning arrives as provider-visible `reasoning_text` content
    # with an empty summary list; do not request an OpenAI-style summary.
    reasoning_summary: none

harbor:
  agent: codex
  import_path: codex_gateway:CodexGateway
  kwargs:
    gateway_base_url: http://gateway:8080/model/openrouter/v1
    web_search: disabled

# Agent-side client values only; the gateway holds the real OpenRouter key.
environment:
  OPENAI_BASE_URL: http://gateway:8080/model/openrouter/v1
  OPENAI_API_KEY: testbed
