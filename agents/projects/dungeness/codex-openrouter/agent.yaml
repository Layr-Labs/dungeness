schema_version: 1
type: agent
namespace: projects/dungeness
id: codex-openrouter
execution_mode: installed

# Keep the image and Harbor adapter on the same tested Codex release. Harbor
# sees the preinstalled binary and therefore performs no network installation
# after the sandbox has started.
package:
  name: "@openai/codex"
  version: "0.148.0"

model:
  provider: openrouter
  upstream_id: openai/gpt-5.6-sol
  request_model: openai/gpt-5.6-sol
  api: openai-responses
  name_format: request
  defaults:
    reasoning_effort: high

harbor:
  agent: codex
  import_path: codex_gateway:CodexGateway
  kwargs:
    gateway_base_url: http://gateway:8080/model/openrouter/v1
    web_search: disabled

# These are agent-side client values, not provider credentials. The gateway
# receives the real provider key through a separately named host variable.
environment:
  OPENAI_BASE_URL: http://gateway:8080/model/openrouter/v1
  OPENAI_API_KEY: testbed
