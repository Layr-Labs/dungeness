schema_version: 1
type: agent
namespace: projects/dungeness
id: codex-openai
execution_mode: installed

image:
  from: agent:projects/dungeness/codex-openrouter

package:
  name: "@openai/codex"
  version: "0.148.0"

model:
  provider: openai
  upstream_id: openai/gpt-5.6-sol
  request_model: gpt-5.6-sol
  api: openai-responses
  name_format: request
  defaults:
    reasoning_effort: high

harbor:
  agent: codex
  import_path: codex_gateway:CodexGateway
  kwargs:
    gateway_base_url: http://gateway:8080/model/openai/v1
    web_search: disabled

environment:
  OPENAI_BASE_URL: http://gateway:8080/model/openai/v1
  OPENAI_API_KEY: testbed
