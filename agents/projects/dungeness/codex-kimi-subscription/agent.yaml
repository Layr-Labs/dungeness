schema_version: 1
type: agent
namespace: projects/dungeness
id: codex-kimi-subscription
execution_mode: installed

image:
  from: agent:projects/dungeness/codex-openrouter

package:
  name: "@openai/codex"
  version: "0.148.0"

authentication:
  mode: kimi-code-membership
  credential: kimi-code
  isolation: gateway

model:
  provider: kimi-code
  upstream_id: kimi-code/k3
  request_model: k3
  api: openai-responses
  name_format: request
  context_window: 1048576
  supported_reasoning_efforts: [low, high, max]
  defaults:
    reasoning_effort: high
    reasoning_summary: none

adapter: adapter:system/dungeness/responses-to-chat

harbor:
  agent: codex
  import_path: codex_gateway:CodexGateway
  kwargs:
    gateway_base_url: http://gateway:8080/model/kimi-code/v1
    web_search: disabled

environment:
  OPENAI_BASE_URL: http://gateway:8080/model/kimi-code/v1
  OPENAI_API_KEY: testbed
