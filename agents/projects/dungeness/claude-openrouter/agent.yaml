schema_version: 1
type: agent
namespace: projects/dungeness
id: claude-openrouter
execution_mode: installed

# Reuse the pinned Claude Code image; only the model route differs. Claude Code
# speaks the Anthropic Messages API, which OpenRouter serves at
# `/api/v1/messages`, so the gateway's OpenRouter route carries the traffic and
# bills it from the trusted pricing policy.
image:
  from: agent:projects/dungeness/claude

package:
  name: "@anthropic-ai/claude-code"
  version: "2.1.259"

model:
  provider: openrouter
  upstream_id: anthropic/claude-opus-5
  # OpenRouter needs the vendor-prefixed id. Harbor keeps the full name when a
  # custom ANTHROPIC_BASE_URL is set and points every Claude Code model alias
  # (sonnet/opus/haiku/subagent) at it, so no unpriced side model is requested.
  request_model: anthropic/claude-opus-5
  api: anthropic-messages
  name_format: request

harbor:
  agent: claude-code
  kwargs:
    # Disable only Claude Code's built-in network research tools. External
    # research must use the gateway-controlled `web` command so cutoffs and
    # usage limits remain enforceable.
    disallowed_tools: "WebSearch WebFetch"
    permission_mode: bypassPermissions

# Agent-side client values only; NO real credential. The gateway holds the real
# OpenRouter key (TESTBED_OPENROUTER_API_KEY) and injects it upstream.
#
# ANTHROPIC_BASE_URL is read by Harbor's claude_code agent from the CONTROL
# PLANE (the env `harbor run` sees) to decide model-name handling, so
# `dungeness run` exports it from this block before starting Harbor. Do not set
# ANTHROPIC_BASE_URL in .env: Harbor loads .env with override and would pin
# every Claude profile to one route.
environment:
  ANTHROPIC_BASE_URL: http://gateway:8080/model/openrouter
  ANTHROPIC_API_KEY: testbed
  # Cap per-turn extended thinking (see the `claude` profile). NON-DEFAULT.
  MAX_THINKING_TOKENS: "8000"
