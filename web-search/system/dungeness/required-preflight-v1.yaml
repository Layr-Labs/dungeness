prompt: |

  ### Required web-search preflight

  - Before editing candidate files, spend no more than 5 minutes on
    gateway-mediated web search.
  - Run at least 2 and no more than 3 targeted `web search` queries. Include one
    query for prior algorithms and one for relevant implementations or
    experimental results.
  - Extract one actionable implementation hypothesis from the returned evidence,
    then begin the normal edit-and-evaluate loop.
