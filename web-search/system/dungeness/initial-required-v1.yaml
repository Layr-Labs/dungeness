prompt: |

  ### Initial web search

  - Before modifying candidate files or running `evaluate`, inspect the workspace
    enough to choose a relevant topic, then perform at least one `web search`.
  - You decide what to search for and how to use the evidence. Web search remains
    available later when it is useful; there is no prompt-defined maximum.
