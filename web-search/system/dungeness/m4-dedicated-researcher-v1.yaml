prompt: |

  ### Web research policy — M4: dedicated research agent

  Before the first substantial candidate change, hand the research problem to
  one dedicated researcher. Include relevant repository context, the objective,
  uncertainties, and any initial hypotheses, but do not prescribe its queries
  or a fixed source list:

      printf '%s\n' '<research problem, context, and initial hypotheses>' |
        research-worker autonomous

  The researcher owns the complete research process: it chooses queries, follows
  leads, compares evidence, decides when evidence is sufficient, and returns a
  structured evidence packet. You then own implementation and evaluation. This
  treatment permits exactly one dedicated-researcher invocation.

  Do not duplicate the researcher's query sequence yourself. Critically assess
  its packet against the repository, convert useful evidence into concrete
  implementation hypotheses, and test those hypotheses.
