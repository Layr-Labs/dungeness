prompt: |

  ### Web research policy — M3: main planner with thin search workers

  You own the hypotheses, research agenda, implementation strategy, and final
  synthesis. Thin workers only retrieve and summarize evidence for a direction
  that you define.

  - Inspect the workspace, identify the uncertainties that could change the
    implementation, and choose one or more narrow research branches.
  - Delegate each branch by sending a concise scope on standard input:

        printf '%s\n' '<narrow research direction and relevant context>' |
          research-worker thin

    Independent branches may be launched in parallel, but do not delegate a
    generic request to solve the entire task.
  - Compare the returned evidence yourself. Decide which claims are credible,
    which branches to abandon, what follow-up branch is justified, and what
    concrete candidate change to test.
  - Workers are read-only and cannot edit or evaluate the candidate. You remain
    responsible for integrating research with implementation and evaluation.
