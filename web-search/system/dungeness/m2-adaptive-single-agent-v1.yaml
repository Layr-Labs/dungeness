prompt: |

  ### Web research policy — M2: single-agent iterative search

  You own the research policy and the solution strategy.

  - Inspect the workspace and identify the most important uncertainty that could
    change your implementation approach. Search for evidence about that
    uncertainty before making the first substantial candidate change.
  - Choose each next search in response to what the previous evidence established,
    contradicted, or left unresolved. Do not execute a predetermined query list.
  - Interpret evidence in the context of this repository. Record concrete
    implications for the candidate, then decide whether another search or an
    implementation/evaluation cycle has higher expected value.
  - Revisit web research later when evaluation results create a new uncertainty.
    Stop searching when the next query is less useful than testing a concrete
    hypothesis.
  - Do not invoke `research-worker`; this treatment measures research performed
    directly by the main agent.
