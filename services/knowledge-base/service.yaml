schema_version: 1
type: service
namespace: system/dungeness
id: knowledge-base
created_at: null
published_at: null

runtime:
  language: python
  version: "3.12"
  port: 8078
  protocol: http-json
  endpoint: /v1

network:
  external_egress: false
  agent_visible: true

persistence:
  corpus: immutable-image-content
  audit: events.jsonl
  event_source: knowledge-base

capabilities:
  default_operations:
    - status
    - list
    - search
    - read
    - neighbors
    - inspire
  manifest_restricted: true
  readable_formats:
    - markdown
    - pdf
    - plain-text
  pdf_rendering: request-time-pdftotext-layout
