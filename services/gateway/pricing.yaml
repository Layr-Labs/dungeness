schema_version: 1
type: policy
namespace: system/dungeness
id: model-pricing

# Trusted accounting prices used by the gateway for run records and USD limits.
# Agent manifests select a provider/model but cannot supply or override prices.
entries:
  - provider: openrouter
    upstream_id: openai/gpt-5.6-sol
    request_models: [openai/gpt-5.6-sol]
    input_per_mtok: 5.0
    cached_read_per_mtok: 0.5
    output_per_mtok: 30.0
    note: base tier; requests above 272k input tokens may use a higher tier

  - provider: openrouter
    upstream_id: moonshotai/kimi-k3
    request_models: [moonshotai/kimi-k3]
    input_per_mtok: 3.0
    cached_read_per_mtok: 0.3
    output_per_mtok: 15.0
    note: OpenRouter Kimi K3

  - provider: openai
    upstream_id: openai/gpt-5.6-sol
    request_models: [gpt-5.6-sol, openai/gpt-5.6-sol]
    input_per_mtok: 5.0
    cached_read_per_mtok: 0.5
    output_per_mtok: 30.0
    note: base tier; requests above 272k input tokens may use a higher tier

  # GPT-6 Astra has a distinct cache-write bucket and applies one pricing tier
  # to the whole request when input_tokens exceeds 272,000.
  - provider: openai
    upstream_id: openai/gpt-6-astra
    request_models: [gpt-6-astra, openai/gpt-6-astra]
    input_per_mtok: 10.0
    cached_read_per_mtok: 1.0
    cache_write_per_mtok: 12.5
    output_per_mtok: 50.0
    long_context:
      threshold_input_tokens: 272000
      input_per_mtok: 20.0
      cached_read_per_mtok: 2.0
      cache_write_per_mtok: 25.0
      output_per_mtok: 75.0
    note: OpenAI GPT-6 Astra; cache writes and long-context tier modeled exactly

  # ChatGPT-plan Astra usage is not billed per API token. Apply the same
  # schedule as normalized experimental cost so USD caps remain comparable.
  - provider: openai-chatgpt
    upstream_id: openai/gpt-6-astra
    request_models: [gpt-6-astra]
    input_per_mtok: 10.0
    cached_read_per_mtok: 1.0
    cache_write_per_mtok: 12.5
    output_per_mtok: 50.0
    long_context:
      threshold_input_tokens: 272000
      input_per_mtok: 20.0
      cached_read_per_mtok: 2.0
      cache_write_per_mtok: 25.0
      output_per_mtok: 75.0
    note: normalized Astra cost for ChatGPT subscription; billed USD unavailable

  # Reference pricing for controlled subscription experiments. ChatGPT does not
  # bill these runs per token, but Dungeness applies the same normalized price
  # schedule used by direct OpenAI access.
  - provider: openai-chatgpt
    upstream_id: openai/gpt-5.6-sol
    request_models: [gpt-5.6-sol]
    input_per_mtok: 5.0
    cached_read_per_mtok: 0.5
    output_per_mtok: 30.0
    note: normalized experimental cost; billed USD is unavailable

  - provider: anthropic
    upstream_id: anthropic/claude-opus-5
    request_models: [claude-opus-5]
    input_per_mtok: 5.0
    cached_read_per_mtok: 0.5
    output_per_mtok: 25.0
    note: flat token pricing

  # Claude Code through OpenRouter's Anthropic-compatible Messages API. Same
  # schedule as the direct Anthropic route so budgets compare across routes.
  - provider: openrouter
    upstream_id: anthropic/claude-opus-5
    request_models: [anthropic/claude-opus-5]
    input_per_mtok: 5.0
    cached_read_per_mtok: 0.5
    output_per_mtok: 25.0
    note: OpenRouter Claude Opus 5; flat token pricing

  # Claude Fable 5.1 through OpenRouter (Responses API for Codex). Prices from
  # OpenRouter's model listing on 2026-09-03: $10 / $50 per MTok, $0.25 cache read.
  - provider: openrouter
    upstream_id: anthropic/claude-fable-5.1
    request_models: [anthropic/claude-fable-5.1]
    input_per_mtok: 10.0
    cached_read_per_mtok: 0.25
    output_per_mtok: 50.0
    note: OpenRouter Claude Fable 5.1; flat token pricing

  # Additional pinned local evidence identities, 2026-10-30.
