  # https://developers.openai.com/api/docs/models/gpt-5.6-terra
  # Standard text reference checked 2026-11-18, including cache writes and
  # the whole-request long-context tier. ChatGPT costs are normalized.
  - provider: openai
    upstream_id: openai/gpt-5.6-terra
    request_models: [gpt-5.6-terra]
    input_per_mtok: 2.0
    cached_read_per_mtok: 0.2
    cache_write_per_mtok: 2.5
    output_per_mtok: 12.0
    text_only: true
    long_context:
      threshold_input_tokens: 272000
      input_per_mtok: 4.0
      cached_read_per_mtok: 0.4
      cache_write_per_mtok: 5.0
      output_per_mtok: 18.0
    note: GPT-5.6 Terra Standard text reference; default cache retention only

  - provider: openai-chatgpt
    upstream_id: openai/gpt-5.6-terra
    request_models: [gpt-5.6-terra]
    input_per_mtok: 2.0
    cached_read_per_mtok: 0.2
    cache_write_per_mtok: 2.5
    output_per_mtok: 12.0
    text_only: true
    long_context:
      threshold_input_tokens: 272000
      input_per_mtok: 4.0
      cached_read_per_mtok: 0.4
      cache_write_per_mtok: 5.0
      output_per_mtok: 18.0
    note: normalized GPT-5.6 Terra cost for ChatGPT access; billed USD unavailable

  # Standard text pricing checked 2026-11-18:
  # https://developers.openai.com/api/docs/models/gpt-6.1-terra
  # Tool calling uses Responses. Extended cache retention and service tiers
  # remain outside the gateway's supported request contract.
  - provider: openai
    upstream_id: openai/gpt-6.1-terra
    request_models: [gpt-6.1-terra]
    input_per_mtok: 1.0
    cached_read_per_mtok: 0.05
    cache_write_per_mtok: 1.25
    output_per_mtok: 5.0
    text_only: true
    long_context:
      threshold_input_tokens: 272000
      input_per_mtok: 2.0
      cached_read_per_mtok: 0.1
      cache_write_per_mtok: 2.5
      output_per_mtok: 7.5
    note: GPT-6.1 Terra Standard text reference; 30-minute cache writes

  - provider: openai-chatgpt
    upstream_id: openai/gpt-6.1-terra
    request_models: [gpt-6.1-terra]
    input_per_mtok: 1.0
    cached_read_per_mtok: 0.05
    cache_write_per_mtok: 1.25
    output_per_mtok: 5.0
    text_only: true
    long_context:
      threshold_input_tokens: 272000
      input_per_mtok: 2.0
      cached_read_per_mtok: 0.1
      cache_write_per_mtok: 2.5
      output_per_mtok: 7.5
    note: normalized Terra cost for ChatGPT access; billed USD unavailable

  - provider: openrouter
    upstream_id: openai/gpt-5.6-sol
    request_models: [openai/gpt-5.6-sol]
    input_per_mtok: 5.0
    cached_read_per_mtok: 0.5
    output_per_mtok: 30.0
    note: base tier; requests above 272k input tokens may use a higher tier

  - provider: openrouter
    upstream_id: moonshotai/kimi-k3
    request_models: [moonshotai/kimi-k3]
    input_per_mtok: 3.0
    cached_read_per_mtok: 0.3
    output_per_mtok: 15.0
