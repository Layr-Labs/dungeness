name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: make check-core
      - name: Native Google SDK contract
        if: matrix.python == '3.12'
        run: uv run --frozen --group gateway --with google-genai==3.6.1 python -B script/check-google-client.py
      - name: Harbor adapter contract
        if: matrix.python == '3.12'
        run: make check-harbor

  gateway-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Gateway isolation with synthetic credentials
        run: python3 script/check-gateway-isolation.py

  run-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          python-version: "3.12"
      - name: Two concurrent runs with synthetic services and credentials
        run: make check-run-isolation

  runtime-verification:
    if: vars.RUNTIME_VERIFY_CACHE_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DUNGENESS_VERIFY_IMAGE: ${{ vars.RUNTIME_VERIFY_IMAGE_ID }}
      DUNGENESS_VERIFY_STOCK_ADAPTER: ${{ runner.temp }}/runtime-verify/stock_adapter.py
      DUNGENESS_VERIFY_UV_CACHE: ${{ runner.temp }}/runtime-verify/uv
      DUNGENESS_VERIFY_GOOGLE_PYTHON: ${{ runner.temp }}/runtime-verify/google/bin/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - name: Restore approved fixture inputs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/runtime-verify
          key: ${{ vars.RUNTIME_VERIFY_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Load the local fixture image
        run: docker load --input "$RUNNER_TEMP/runtime-verify/image.tar"
      - run: make verify PROVE=1
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-verification
          path: .verify/prove/
          include-hidden-files: true
