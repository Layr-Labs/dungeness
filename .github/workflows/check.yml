name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: make check-core
      - name: Harbor adapter contract
        if: matrix.python == '3.12'
        run: make check-harbor

  gateway-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gateway isolation with synthetic credentials
        run: python3 script/check-gateway-isolation.py
